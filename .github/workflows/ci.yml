name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: dogfood (lint own docs)
        run: node dist/cli.js lint README.md SKILL.md --fail-on warning

  # main の dist/ を src/ のビルド結果へ追従させる。
  # GITHUB_TOKEN による push は新しい workflow run を作らないため、この commit で ci は再実行されない。
  dist:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dist-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: commit and push dist if changed
        run: |
          if [ -z "$(git status --porcelain dist)" ]; then
            echo "dist is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore(dist): src の変更に合わせて dist を再ビルドする"
          git push origin HEAD:main
